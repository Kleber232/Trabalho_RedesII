user  root;
worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    access_log  /usr/local/nginx/logs/access.log;
    error_log   /usr/local/nginx/logs/error.log info;

    # -----------------------------------------------------------------
    # Cenário TCP (baseline): HTTP/1.1 puro, sem TLS, porta 80
    # Útil para comparar overhead "cru" antes de entrar em TLS/QUIC.
    # -----------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        root /usr/local/nginx/html;
        autoindex on;

        location /files/ {
            autoindex on;
        }
    }

    # -----------------------------------------------------------------
    # Cenário TCP: HTTP/2 sobre TLS 1.3, porta 443 (TCP)
    # -----------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /usr/local/nginx/certs/server.crt;
        ssl_certificate_key /usr/local/nginx/certs/server.key;
        ssl_protocols       TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        root /usr/local/nginx/html;
        autoindex on;

        location /files/ {
            autoindex on;
        }

        # Anuncia disponibilidade de HTTP/3 na mesma porta (UDP)
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    # -----------------------------------------------------------------
    # Cenário QUIC: HTTP/3 sobre UDP, porta 443 (UDP)
    # -----------------------------------------------------------------
    server {
        listen 443 quic reuseport;
        server_name _;

        ssl_certificate     /usr/local/nginx/certs/server.crt;
        ssl_certificate_key /usr/local/nginx/certs/server.key;
        ssl_protocols       TLSv1.3;

        root /usr/local/nginx/html;
        autoindex on;

        location /files/ {
            autoindex on;
        }

        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        # quic_retry on; # opcional: ativa validação de endereço (mitiga amplification attacks)
    }
}
